name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

# Deliberately no `next build` here. The build needs DATABASE_URL and the auth
# secrets, and a CI job that needs production credentials is a job somebody
# eventually turns off. Vercel builds every push already.
